name: Sidekick Data
description: 'Sidekick is a professional AI assistant for real estate agents and brokerages,
  built on the same large language model technology that powers ChatGPT with custom
  integrations into real estate-specific data sources. From a chat-style interface it
  combines an agent''s inputs with MLS data feeds, local market insights, and a brokerage''s
  brand preferences to produce detailed, on-voice outputs - covering client relationship
  tracking, email and call interaction analysis, market trend monitoring, property
  comparisons, transaction document management, and compliance risk detection. Sidekick
  is directly integrated with MLS and association data feeds across the United States
  and is backed by investors including Socium Ventures, Swift Ventures, and Garuda
  Ventures. It is a consumer/professional SaaS product and publishes no public developer
  API, SDKs, or developer documentation.'
